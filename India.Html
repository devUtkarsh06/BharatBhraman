<div id="tip"><strong></strong><small></small></div>
<script>
// Each region links to PAGE_BASE + slugified-name + PAGE_EXT
// e.g. "Andhra Pradesh" -> "states/andhra-pradesh.html"
// Change these two constants to match wherever your per-state pages live.
const PAGE_BASE = 'states/';
const PAGE_EXT = '.Html';

const tip=document.getElementById('tip');
const title=tip.querySelector('strong');
const meta=tip.querySelector('small');

function moveTip(e){
  let x=e.clientX+16, y=e.clientY+16;
  if(x>innerWidth-270) x=e.clientX-265;
  if(y>innerHeight-90) y=e.clientY-82;
  tip.style.left=x+'px';
  tip.style.top=y+'px';
}

function setup(el,lift){
  function show(e){
    title.textContent=el.dataset.name;
    meta.textContent=(el.classList.contains('ut-hit')?'Union Territory':'State')+
      ' · Capital: '+el.dataset.cap;
    tip.classList.add('show');
    if(lift) lift.classList.add('active');
    moveTip(e);
  }
  function hide(){
    tip.classList.remove('show');
    if(lift) lift.classList.remove('active');
  }
  el.addEventListener('mouseenter',show);
  el.addEventListener('mousemove',moveTip);
  el.addEventListener('mouseleave',hide);
  el.addEventListener('focus',show);
  el.addEventListener('blur',hide);
  el.addEventListener('click',()=>{
    const u = PAGE_BASE + el.dataset.name + '.Html';
    window.location.href = u;
  });
}
document.querySelectorAll('.state-hit').forEach(el=>setup(el,document.getElementById('lift'+el.dataset.index)));
document.querySelectorAll('.ut-hit').forEach(el=>setup(el,null));
</script>
