<div class="page">
  <div class="head"><h1>Pondicherry — Interactive Tourist Map</h1><p>Only the tourist dots are interactive. Hover for the place; click a dot to open its details beside the map.</p></div>
  <div id="layout" class="layout">
    <section class="map-card">
      <svg id="map" viewBox="0 0 900 620" role="img" aria-label="Map of Pondicherry"></svg>
      <div class="legend"><i></i> Tourist attraction / destination</div>
    </section>

  </div>

<script type="module">
const PLACE_ABOUT={"Panaji": ["Approx. 7 m", "Panaji is the capital of Goa and a compact riverside city with a strong Portuguese-influenced heritage. Its Latin Quarter, Fontainhas, colourful houses, churches, cafés and Mandovi riverfront make it a pleasant place to explore on foot. The city also provides easy access to North Goa beaches, Old Goa and other cultural attractions. Visitors can combine heritage walks with local Goan food, riverfront experiences and nearby sightseeing."], "Calangute": ["Near sea level", "Calangute is one of Goa's best-known beach destinations and is often called the Queen of Beaches. Its broad sandy shoreline is surrounded by restaurants, cafés, shops, water-sports operators and accommodation for different budgets. It is a convenient base for exploring nearby North Goa beaches and heritage attractions. The dry winter season is particularly popular for beach activities and outdoor sightseeing."], "Palolem": ["Near sea level", "Palolem is a scenic beach in South Goa known for its curved shoreline, coconut palms, calm coastal atmosphere and colourful beach huts. The area is popular for swimming, kayaking, boat trips and relaxed evenings by the sea when conditions are suitable. Nearby beaches and viewpoints can easily be included in the same trip. The cooler dry months are generally the most comfortable for enjoying the coast."], "Leh": ["Approx. 3,524 m", "Leh is the principal town and gateway to Ladakh, set high in the Himalayas amid dramatic barren mountains. The destination is known for its monasteries, Leh Palace, traditional markets, Tibetan-Buddhist culture and spectacular mountain scenery. It is also the usual starting point for journeys towards Nubra Valley, Pangong Lake and other high-altitude areas. Because of its elevation, visitors should allow time to acclimatise and should take changing mountain weather seriously."], "Nubra Valley": ["Approx. 3,000–4,000 m", "Nubra Valley is a high Himalayan valley north of Leh, famous for its stark mountains, villages, monasteries, river landscapes and distinctive sand dunes. The valley provides a striking contrast of cold-desert terrain with pockets of green cultivated land. Visitors commonly explore Diskit, Hunder and surrounding villages while travelling through the Khardung La route. High altitude and mountain-road conditions mean that travellers should plan the journey carefully."], "Pangong Lake": ["Approx. 4,225 m", "Pangong Lake is a spectacular high-altitude lake extending across the Himalayan landscape and is famous for its deep blue water and surrounding mountains. The colour and appearance of the lake can change with light and weather, creating dramatic scenery for visitors. The journey itself is an important part of the experience, passing through remote high-altitude terrain. Cold conditions, altitude and road access should be considered carefully before travelling."], "Khardung La": ["Approx. 5,359 m", "Khardung La is a high mountain pass north of Leh and is one of the most famous points on the route towards Nubra Valley. Visitors come primarily for the dramatic Himalayan scenery and the experience of travelling through a very high mountain environment. Conditions can be cold, windy and unpredictable even when the weather in Leh is pleasant. Because of the altitude, travellers should avoid rushing and follow local road and safety advice."], "Tso Moriri": ["Approx. 4,522 m", "Tso Moriri is a remote high-altitude lake in the Changthang region of Ladakh, surrounded by stark mountains and wide open landscapes. Its peaceful setting and limited development make it particularly appealing to travellers seeking a quieter Himalayan experience. The surrounding region is also important for high-altitude wildlife and pastoral communities. The remote road journey, altitude and weather make advance planning especially important."], "Jaipur": ["Approx. 430 m", "Jaipur is the capital of Rajasthan and is widely known as the Pink City because of the distinctive colour of many buildings in its historic centre. The city combines Rajput and Mughal-influenced architecture with forts, palaces, observatories, markets, crafts and a rich food culture. Amber Fort, City Palace, Hawa Mahal and Jantar Mantar are among its major attractions. Jaipur is an excellent destination for experiencing Rajasthan's royal heritage while also serving as a base for nearby historic sites."], "Udaipur": ["Approx. 598 m", "Udaipur is known as the City of Lakes and is surrounded by the Aravalli hills, giving the city a particularly scenic setting. Its palaces, lakes, gardens, old streets and traditional crafts provide a strong combination of heritage and landscape experiences. City Palace, Lake Pichola, Jagdish Temple and nearby viewpoints are popular with visitors. The city is especially enjoyable when sightseeing can be combined with lakeside walks, boat rides and evening views."], "Jodhpur": ["Approx. 231 m", "Jodhpur, the Blue City, is dominated by the enormous Mehrangarh Fort and is famous for the blue-painted lanes of its old city. The destination offers royal architecture, historic markets, temples, museums and sweeping views across the surrounding landscape. Mehrangarh, Jaswant Thada and the old-city bazaars are among the main experiences for visitors. Its desert-edge setting makes the cooler months particularly suitable for walking and sightseeing."], "Jaisalmer": ["Approx. 225 m", "Jaisalmer is the Golden City of Rajasthan, celebrated for its honey-coloured sandstone buildings and its location on the edge of the Thar Desert. The living Jaisalmer Fort, ornate havelis, historic lanes and desert villages reveal the city's former importance as a trading centre. Travellers can also experience desert landscapes through excursions and traditional cultural activities. Winter is generally the most comfortable period for extensive outdoor exploration."], "Pushkar": ["Approx. 510 m", "Pushkar is a historic town centred around the sacred Pushkar Lake and is one of Rajasthan's best-known pilgrimage and cultural destinations. Its ghats, temples, narrow market streets and annual fair create a distinctive atmosphere for visitors. The town can be combined easily with Ajmer and other nearby attractions. Visitors should respect local religious customs, particularly around the lake and temples."], "Shimla": ["Approx. 2,205 m", "Shimla is a historic Himalayan hill station and the former summer capital of British India. Its colonial buildings, Ridge, Mall Road, churches, viewpoints and surrounding pine-covered hills give the town a distinctive mountain character. It is popular both as a relaxed holiday destination and as a base for exploring the surrounding region. Summer is favoured by many travellers for its cooler temperatures, while winter brings a colder atmosphere and occasional snow."], "Manali": ["Approx. 2,050 m", "Manali is a popular Himalayan resort town set in the Beas River valley and surrounded by forested mountains. It offers a mix of temples, old-town areas, viewpoints, cafés, adventure activities and access to higher mountain landscapes. Solang Valley, Old Manali and nearby natural attractions are commonly included in itineraries. Weather and road conditions vary strongly by season, so activities should be planned around current mountain conditions."], "Dharamshala": ["Approx. 1,450 m", "Dharamshala is a scenic Himalayan destination known for its mountain setting, Tibetan cultural influence and access to the lively hill town of McLeod Ganj. Visitors can explore monasteries, temples, cafés, viewpoints and forested trails while enjoying views across the Kangra Valley. The surrounding region also offers opportunities for short hikes and visits to villages. The pleasant mountain climate makes it suitable for sightseeing across much of the year, with seasonal changes in temperature and rainfall."], "Kullu": ["Approx. 1,220 m", "Kullu lies in a broad Himalayan valley along the Beas River and is known for its orchards, temples, traditional culture and surrounding mountain scenery. The valley provides a quieter complement to the more developed tourist areas of nearby Manali. Visitors can explore riverside landscapes, local villages and cultural attractions while using Kullu as a base for regional trips. The valley's scenery changes considerably between seasons, making different times of year attractive for different activities."], "Dalhousie": ["Approx. 1,970 m", "Dalhousie is a peaceful hill station spread across forested slopes in the western Himalayas. Its colonial-era buildings, churches, pine forests and mountain viewpoints create a relaxed setting away from larger tourist centres. Visitors can explore the town on foot and make excursions towards nearby Khajjiar and other scenic areas. Cooler weather is one of its main attractions, although winter conditions can be considerably colder."], "Kochi": ["Near sea level", "Kochi is a historic coastal city in Kerala where maritime trade, colonial heritage and modern urban life meet. Fort Kochi is especially known for its old streets, churches, galleries, cafés and iconic Chinese fishing nets. The city also provides access to Kerala's backwaters and other cultural attractions. Visitors can combine heritage walks with local seafood, markets, boat experiences and nearby sightseeing."], "Thiruvananthapuram": ["Approx. 10 m", "Thiruvananthapuram is the capital of Kerala and an important centre of culture, history and pilgrimage. The city is known for the Padmanabhaswamy Temple, museums, palaces, art institutions and access to the nearby coastal destination of Kovalam. Its streets combine traditional Kerala architecture with a modern city environment. Visitors can use the city as a cultural base while making short trips to beaches and other attractions."], "Munnar": ["Approx. 1,532 m", "Munnar is a scenic hill station surrounded by tea plantations, rolling hills, forests and waterfalls in Kerala's Western Ghats. The landscape is strongly associated with tea cultivation, cool mountain weather and expansive green views. Visitors can explore tea estates, viewpoints, gardens, waterfalls and nearby wildlife areas. The destination is well suited to relaxed sightseeing and nature-focused trips, although rainfall can affect outdoor plans."], "Alappuzha": ["Near sea level", "Alappuzha, often called Alleppey, is one of Kerala's best-known backwater destinations. Its network of canals, lagoons, villages and waterways provides the setting for traditional houseboat journeys and slower-paced sightseeing. Visitors can combine a backwater stay with local food, village scenery and nearby coastal attractions. The experience changes with the seasons, and boat operations can be affected by weather conditions."], "Kozhikode": ["Near sea level", "Kozhikode is a historic Malabar Coast city known for its beaches, food traditions, markets and long connection with maritime trade. The city provides visitors with an opportunity to experience northern Kerala's culture and cuisine in addition to its coastal scenery. Historic areas and local markets can be explored alongside nearby beaches and cultural sites. Its warm coastal climate makes early morning and evening sightseeing particularly comfortable."], "Goa": ["Near sea level", "Goa is a compact coastal state famous for beaches, Portuguese-influenced heritage, seafood, churches, local festivals and a relaxed tropical atmosphere. It offers several different travel experiences, from lively North Goa beaches to quieter southern coastal areas and historic Old Goa. Visitors can combine beaches with forts, churches, markets, nature and local cuisine. The cooler dry season is particularly popular for outdoor activities, although Goa remains a year-round destination."], "Visakhapatnam": ["Near sea level", "Visakhapatnam, or Vizag, is a major coastal city in Andhra Pradesh known for beaches, hill viewpoints and a long seafront. The city's combination of coastline, nearby hills and cultural attractions gives visitors a variety of experiences within a relatively compact region. Popular outings include beaches, viewpoints, museums and nearby natural attractions. The coastal climate is warm, so planning outdoor sightseeing during comfortable parts of the day is useful."], "Tirupati": ["Approx. 160 m", "Tirupati is one of India's most important pilgrimage destinations and serves as the gateway to the Tirumala hills and the renowned Venkateswara Temple. The city and surrounding hills have a strong religious atmosphere and receive visitors throughout the year. Travellers can also explore nearby temples, viewpoints and cultural sites. Because visitor numbers can be very high during festivals and holidays, advance planning is useful."], "Araku Valley": ["Approx. 900 m", "Araku Valley is a scenic hill region in the Eastern Ghats known for coffee plantations, waterfalls, caves, tribal culture and green mountain landscapes. The journey through the surrounding hills is itself an important part of the experience. Visitors can explore plantations, viewpoints, museums and nearby natural attractions. Its cooler climate makes it a popular escape from the warmer coastal plains."], "Guwahati": ["Approx. 55 m", "Guwahati is Assam's largest city and an important gateway to the wider Northeast. It lies along the Brahmaputra River and is particularly known for the Kamakhya Temple, river views, markets and access to nearby natural and cultural attractions. Visitors can use the city as a base for exploring Assam and onward destinations. The warm climate means that sightseeing is often more comfortable during mornings and evenings."], "Kaziranga": ["Approx. 40–80 m", "Kaziranga is one of India's most famous wildlife destinations and a UNESCO World Heritage landscape, particularly renowned for its greater one-horned rhinoceros. Its grasslands, wetlands and forests support a rich variety of wildlife and birdlife. Jeep and other permitted safari experiences provide the main way to explore the park. Visitors should follow park rules and seasonal opening arrangements, as wildlife access changes through the year."], "Majuli": ["Approx. 85 m", "Majuli is a large river island in the Brahmaputra and is famous for its Assamese Vaishnavite culture, satras, traditional crafts and distinctive island communities. Its rural landscape and cultural institutions offer a very different experience from Assam's larger cities. Visitors can explore monasteries, villages, mask-making traditions and riverine scenery. Ferry access and river conditions are important practical considerations when planning a visit."], "Patna": ["Approx. 53 m", "Patna is the capital of Bihar and a historic city situated along the Ganga. It has strong connections with ancient Indian history, Buddhism, Jainism and the political history of the region. Museums, religious sites and riverfront areas provide visitors with opportunities to understand Bihar's cultural heritage. Patna is also a useful base for visiting Bodh Gaya, Nalanda and other nearby historical destinations."], "Bodh Gaya": ["Approx. 113 m", "Bodh Gaya is one of the world's most important Buddhist pilgrimage destinations and is centred on the Mahabodhi Temple complex. It is traditionally associated with the place where Siddhartha Gautama attained enlightenment, making it a major destination for Buddhist pilgrims and visitors interested in spiritual history. Temples and monasteries representing several Buddhist traditions can be found around the town. The destination has a peaceful but international atmosphere, particularly during major Buddhist observances."], "Nalanda": ["Approx. 67 m", "Nalanda is an important archaeological destination associated with the ancient Nalanda Mahavihara, one of the great centres of learning of the ancient world. The ruins, monasteries and museum help visitors understand the scale and intellectual importance of the historic institution. The site is especially interesting for travellers interested in Buddhism, archaeology and Indian educational history. It is commonly combined with Rajgir and Bodh Gaya in a Bihar heritage circuit."], "Bhubaneswar": ["Approx. 45 m", "Bhubaneswar is the capital of Odisha and one of eastern India's most important temple cities. Its historic temples display distinctive Kalinga architecture and provide an introduction to Odisha's religious and artistic heritage. The city also has museums, markets and good connections to Puri and Konark, making it an effective base for exploring the region. Cooler months are generally more comfortable for visiting outdoor monuments."], "Puri": ["Near sea level", "Puri is a major coastal pilgrimage city known for the Jagannath Temple, long sandy beach and vibrant religious culture. The city combines spiritual heritage with seaside recreation and is an important stop on Odisha's tourist circuit. Visitors often combine Puri with the Sun Temple at Konark and excursions towards Chilika Lake. Respect for local religious customs is important around the temple and other sacred areas."], "Konark": ["Near sea level", "Konark is internationally known for the UNESCO-listed Sun Temple, an extraordinary example of medieval Indian architecture. The monument is designed in the form of a monumental chariot and is covered with detailed stone carvings depicting religious, social and artistic themes. Visitors can combine the temple with nearby beaches and other coastal attractions. The open nature of the site makes cooler months particularly comfortable for exploring it."], "Chilika": ["Near sea level", "Chilika is a vast coastal lagoon and one of India's most important wetland ecosystems. It is known for migratory birds, fishing communities, islands and boat journeys through a changing landscape of water and wetlands. The lagoon is especially attractive to visitors interested in nature and birdwatching. Wildlife and boating experiences depend on season, water conditions and local regulations."], "Agra": ["Approx. 171 m", "Agra is a historic city on the Yamuna and one of India's most important heritage destinations, best known for the Taj Mahal. Agra Fort and other monuments reveal the city's major role during the Mughal period and provide a wider historical context beyond the Taj Mahal itself. Visitors can also explore traditional crafts, markets and nearby heritage sites. Early mornings and cooler months are generally more comfortable for monument visits."], "Amritsar": ["Approx. 234 m", "Amritsar is a major cultural and spiritual destination in Punjab and is best known for the Golden Temple, one of Sikhism's most important places of worship. The surrounding old city also offers historic sites, Punjabi food, markets and places connected with India's modern history. Jallianwala Bagh and the Wagah-Attari border ceremony are popular additions to a visit. The city is particularly rewarding when visitors allow time to experience both its religious and cultural sides."], "Varanasi": ["Approx. 80 m", "Varanasi is one of India's oldest living cities and is renowned for its ghats along the Ganga, temples and long-standing spiritual traditions. Sunrise boat rides, evening ceremonies, historic lanes, music, crafts and local food all contribute to the city's distinctive character. The city can be intense and crowded, but quieter areas reveal a rich everyday cultural life. Cooler months are generally comfortable for walking and spending extended periods around the ghats."], "Ayodhya": ["Approx. 93 m", "Ayodhya is a historic city on the Sarayu River and an important pilgrimage destination associated with Ramayana traditions. The city contains temples, ghats and religious sites that attract visitors from across India. Recent development has added new visitor facilities while the older sacred landscape remains central to the experience. Visitors should allow time for temple visits, riverside areas and the city's wider cultural heritage."], "Mathura": ["Approx. 174 m", "Mathura is a major pilgrimage city associated with Krishna traditions and forms part of the wider Braj cultural region. Its temples, ghats, markets and festivals create a strong religious and cultural atmosphere. Visitors can combine Mathura with nearby Vrindavan and other Braj destinations for a fuller experience. Major festivals can be extremely busy, so travellers should plan accommodation and local transport in advance."], "Dehradun": ["Approx. 640 m", "Dehradun lies in a broad Himalayan foothill valley and is known for its green surroundings, educational institutions and role as a gateway to Uttarakhand. The city offers a mixture of urban attractions, forests, temples and access to nearby hill destinations. Visitors often combine Dehradun with Mussoorie, Rishikesh and other nearby places. Its location makes it useful both as a destination in its own right and as a starting point for wider Uttarakhand travel."], "Mussoorie": ["Approx. 2,005 m", "Mussoorie is a popular Himalayan hill station known for forested slopes, mountain views, colonial-era character and its lively Mall Road. The town has viewpoints, walking routes, waterfalls and nearby scenic areas that make it suitable for short holidays and longer hill trips. Visitors can also explore Landour and other quieter parts of the surrounding hills. Summer is popular for escaping the heat of the plains, while winter offers a colder and quieter atmosphere."], "Nainital": ["Approx. 2,084 m", "Nainital is a lake town in the Kumaon Himalayas built around the scenic Naini Lake. Forested hills, viewpoints, temples, markets and boating experiences make it one of Uttarakhand's most popular hill destinations. Visitors can explore the lakefront and surrounding viewpoints or use the town as a base for nearby excursions. The climate is noticeably cooler than the plains, with different attractions and road conditions across the seasons."], "Rishikesh": ["Approx. 372 m", "Rishikesh is a riverside Himalayan gateway known for yoga, spiritual centres, temples and adventure activities along the Ganga. Suspension bridges, ashrams, riverfront areas and nearby forests create a varied experience for visitors. The town is also a major starting point for rafting and journeys towards the higher Himalayas. River conditions and weather can affect adventure activities, so travellers should follow local safety guidance."], "Kedarnath": ["Approx. 3,583 m", "Kedarnath is a high Himalayan pilgrimage destination centred on the revered Kedarnath Temple. The temple sits in a dramatic mountain valley and is reached through a demanding journey that forms an important part of the pilgrimage experience. The surrounding landscape is characterised by steep mountains, rivers and high-altitude terrain. Access is highly seasonal and weather-dependent, so visitors must check current arrangements and prepare carefully for altitude and changing conditions."], "Darjeeling": ["Approx. 2,050 m", "Darjeeling is a famous Himalayan hill station known for tea gardens, mountain panoramas, colonial-era buildings and its heritage railway. The town combines Himalayan, Tibetan and colonial influences and offers viewpoints, monasteries, markets and cultural experiences. Clear-weather periods can provide spectacular views towards the high Himalayan peaks. Visitors should be prepared for cool temperatures and changing mountain weather."], "Kolkata": ["Approx. 9 m", "Kolkata is a major cultural city on the Hooghly River and is renowned for literature, arts, food, colonial architecture and a rich intellectual history. Historic neighbourhoods, museums, memorials, markets and riverfront areas reveal different sides of the city. Visitors can explore landmarks such as the Victoria Memorial and Howrah area while also experiencing local cuisine and everyday city life. The cooler months are generally more comfortable for extensive outdoor sightseeing."], "Srinagar": ["Approx. 1,585 m", "Srinagar is the principal city of the Kashmir Valley and is famous for Dal Lake, houseboats, Mughal gardens and traditional handicrafts. Its waterways, surrounding mountains and historic neighbourhoods create a distinctive landscape that changes beautifully with the seasons. Visitors can take shikara rides, explore gardens and markets and use the city as a base for destinations such as Gulmarg and Pahalgam. Weather and road conditions vary by season, so flexible planning is useful."], "Gulmarg": ["Approx. 2,650 m", "Gulmarg is a high-altitude meadow destination surrounded by the mountains of Kashmir and is particularly famous for the Gulmarg Gondola and winter snow activities. In warmer months, its green meadows and mountain scenery attract visitors for walks and sightseeing. Winter brings snow and opportunities for skiing and other activities when conditions permit. Mountain weather can change quickly, so visitors should check current conditions and dress appropriately."], "Pahalgam": ["Approx. 2,200 m", "Pahalgam is a scenic Kashmir valley destination known for rivers, meadows, pine forests and dramatic mountain landscapes. The town is a popular base for exploring surrounding valleys and trekking routes, while nearby areas offer quieter views of the region's natural scenery. Visitors can enjoy walks, horse rides where available and riverside experiences. Seasonal weather strongly affects outdoor activities and road access in the surrounding mountains."], "Sonamarg": ["Approx. 2,800 m", "Sonamarg is a high mountain valley known for alpine scenery, meadows, rivers and access to glaciers and Himalayan routes. The landscape changes significantly between the warmer months and the snow season, making it attractive to different kinds of travellers at different times. Visitors come mainly for mountain views, walks and excursions into the surrounding valleys. Access can be affected by snow and weather, so current road conditions are important."], "Jammu": ["Approx. 327 m", "Jammu is a historic city and an important gateway to the Himalayan region, known for temples, heritage sites and its role in pilgrimage travel. The city has a different climate and landscape from the higher Kashmir Valley and is often used as a starting point for onward journeys. Visitors can explore temples, local markets and nearby historic attractions. Winter and the cooler parts of the year are generally more comfortable for city sightseeing."], "Gangtok": ["Approx. 1,650 m", "Gangtok is the capital of Sikkim and a mountain city known for monasteries, viewpoints, markets and Himalayan scenery. It provides access to several parts of Sikkim and is commonly used as a base for excursions into higher valleys and scenic mountain routes. Visitors can explore local culture, monasteries and viewpoints while enjoying views towards Kanchenjunga when the weather is clear. Mountain roads and weather can change rapidly, so flexible itineraries are helpful."], "Pelling": ["Approx. 2,150 m", "Pelling is a scenic destination in western Sikkim known for broad Himalayan views, monasteries, waterfalls and heritage sites. The town's elevated position makes it a popular viewpoint for mountain scenery when skies are clear. Visitors can combine cultural attractions with short nature excursions and nearby villages. The weather can change quickly in the hills, so conditions should be checked before longer outdoor trips."], "Lachung": ["Approx. 2,900 m", "Lachung is a high mountain village in North Sikkim surrounded by steep valleys, forests and dramatic Himalayan scenery. It is an important base for visiting the alpine landscapes and high-altitude attractions farther north. The journey to Lachung is part of the experience, with winding mountain roads and changing scenery throughout. Visitors should allow time for altitude adjustment and should check permits and road conditions before travelling."], "Chennai": ["Approx. 6 m", "Chennai is a major coastal city and an important centre of Tamil culture, classical arts, temples, museums and cuisine. Its long seafront and historic neighbourhoods provide a mix of urban and coastal experiences. Visitors can explore Marina Beach, temples, museums, markets and heritage areas while sampling local food traditions. The warm coastal climate makes early mornings and evenings useful for outdoor sightseeing."], "Madurai": ["Approx. 101 m", "Madurai is a historic temple city centred on the magnificent Meenakshi Amman Temple and its surrounding streets. The city is deeply connected with Tamil literature, religious traditions, architecture, markets and local food. Visitors can explore temple complexes, bazaars, historic buildings and nearby cultural attractions. Because temperatures can be high, sightseeing is often more comfortable during mornings and evenings."], "Ooty": ["Approx. 2,240 m", "Ooty, or Udhagamandalam, is a popular Nilgiri hill station known for tea estates, gardens, lakes and cool mountain weather. The surrounding hills provide scenic viewpoints and opportunities for relaxed walks, while the heritage mountain railway adds a distinctive travel experience. Visitors can combine Ooty with nearby Coonoor and other Nilgiri attractions. The climate is cooler than the plains throughout the year, with wetter conditions during the monsoon."], "Kodaikanal": ["Approx. 2,133 m", "Kodaikanal is a peaceful hill station in the Palani Hills known for its lake, wooded slopes, waterfalls and viewpoints. The destination has a relaxed atmosphere and is popular for nature walks, boating and scenic drives. Visitors can explore the lake area, viewpoints, forests and nearby natural attractions. Weather is generally cool, but mist and rain can reduce visibility at times."], "Rameswaram": ["Approx. 10 m", "Rameswaram is a coastal pilgrimage town on Pamban Island and is best known for the Ramanathaswamy Temple and its long architectural corridors. Its island setting also provides beaches, sea views and access to places associated with India's southern pilgrimage traditions. Visitors can combine temple visits with coastal sightseeing and nearby Pamban attractions. The warm climate makes shaded areas and early or late-day sightseeing useful."], "Hyderabad": ["Approx. 542 m", "Hyderabad is a historic Deccan city where medieval monuments, royal heritage, distinctive cuisine and a modern technology sector coexist. The Charminar, Golconda Fort, palaces, museums and historic markets provide a strong introduction to the city's past. Visitors can also explore local food traditions and modern cultural districts. Cooler months are generally more comfortable for visiting outdoor monuments and walking through historic areas."], "Warangal": ["Approx. 302 m", "Warangal is a historic Telangana city associated with the Kakatiya dynasty and known for its temples, fortifications and distinctive stone gateways. The region provides an opportunity to explore medieval Deccan architecture and nearby heritage landscapes. Visitors can combine Warangal with the Ramappa Temple and other cultural attractions in the wider area. The cooler months are generally more comfortable for exploring outdoor monuments."], "Agartala": ["Approx. 12 m", "Agartala is the capital of Tripura and a useful base for exploring the state's royal heritage, temples and green landscapes. Ujjayanta Palace and nearby cultural attractions offer an introduction to the history of the former princely state. Visitors can also travel onward to lakes, archaeological sites and natural areas across Tripura. The climate is warm and humid for much of the year, with seasonal rainfall influencing outdoor travel."], "Unakoti": ["Approx. 178 m", "Unakoti is a remarkable archaeological and religious site in northern Tripura, famous for enormous rock-cut sculptures and reliefs associated with Shaivite traditions. The carvings are spread through a forested hillside and create a distinctive atmosphere unlike most conventional temple complexes. Visitors interested in archaeology, art and religious history can spend time examining the detailed stone work. Comfortable footwear is useful because the site involves walking over uneven terrain."], "Neermahal": ["Approx. 15 m", "Neermahal is a striking palace built in the middle of Rudrasagar Lake and is one of Tripura's most distinctive heritage attractions. The building combines royal architecture with a lake setting and is particularly scenic when approached across the water. Visitors can explore the palace and enjoy the surrounding wetland landscape. A visit is often combined with other Agartala-area heritage attractions for a broader Tripura itinerary."], "Delhi": ["Approx. 216 m", "Delhi is India's capital and one of the country's richest destinations for history, architecture, food and culture. The city contains monuments from several historical periods alongside major museums, markets and modern urban districts. Visitors can explore the Red Fort, Humayun's Tomb, Qutub Minar, India Gate and numerous cultural institutions. Delhi is best approached by grouping attractions by area because the city is large and traffic can affect travel times."], "Port Blair": ["Near sea level", "Port Blair is the principal urban gateway to the Andaman Islands and combines island history with coastal scenery. The Cellular Jail, museums and waterfront areas introduce visitors to the history of the islands, while nearby beaches and marine attractions provide a more relaxed experience. It is also the starting point for onward journeys to other islands. Ferry schedules and sea conditions can influence island travel, so visitors should keep connections flexible."], "Chandigarh": ["Approx. 350 m", "Chandigarh is a planned modern city known for its distinctive architecture, landscaped gardens and organised urban design. The Rock Garden, Sukhna Lake and Capitol Complex are among its best-known attractions and showcase different aspects of the city's planning history. Visitors can combine architectural sightseeing with gardens, food and nearby Himalayan foothill trips. The cooler months are generally pleasant for spending time outdoors."], "Daman": ["Near sea level", "Daman is a small coastal destination known for beaches, Portuguese-era heritage, forts and a relaxed seaside atmosphere. Its historic buildings and coastal landscape provide a compact destination that can be explored over a short stay. Visitors can combine fort and church visits with beaches and local seafood. The dry and cooler months are generally more comfortable for coastal sightseeing."], "Diu": ["Near sea level", "Diu is a coastal destination known for its historic fort, Portuguese heritage, beaches and relaxed island-like atmosphere. The town's old architecture and waterfront provide a distinctive contrast to larger Indian beach destinations. Visitors can combine heritage sightseeing with beaches, churches and local seafood. The cooler dry months are particularly comfortable for exploring the coast."], "Silvassa": ["Approx. 32 m", "Silvassa is the capital of Dadra and Nagar Haveli and is known for its green surroundings, gardens, tribal culture and the heritage of the former Portuguese enclave. The destination provides a quieter alternative to larger western Indian cities and offers access to nearby forests and leisure attractions. Visitors can combine cultural experiences with nature and relaxed sightseeing. The cooler months are generally more comfortable for outdoor activities."], "Aizawl": ["Approx. 1,132 m", "Aizawl is the hilly capital of Mizoram, built along ridges with broad views across the surrounding green landscape. The city offers an introduction to Mizo culture through churches, markets, local food and community life. Visitors can explore viewpoints and use Aizawl as a base for excursions into the state's hills and villages. Roads are mountainous, so travel between destinations can take longer than distances on a map suggest."], "Shillong": ["Approx. 1,496 m", "Shillong is a hill city in Meghalaya known for pine forests, waterfalls, viewpoints, music culture and a pleasant mountain setting. It is often used as a base for exploring nearby destinations such as Cherrapunjee and Mawlynnong. Visitors can combine urban sightseeing with short trips into the surrounding hills and valleys. Rainfall can be heavy during the monsoon, while clearer periods are more suitable for long scenic outings."], "Cherrapunjee": ["Approx. 1,484 m", "Cherrapunjee, also known as Sohra, is famous for its exceptionally wet climate, dramatic waterfalls, caves, living-root bridges and green mountain valleys. The surrounding landscape is among Meghalaya's most recognisable natural environments and offers numerous viewpoints and walking routes. Visitors can combine the main attractions with nearby villages and forest areas. Rain can be heavy, so waterproof clothing and proper footwear are important."], "Kohima": ["Approx. 1,444 m", "Kohima is the capital of Nagaland and a hill city known for Naga culture, historic sites, markets and surrounding mountain scenery. The city provides opportunities to learn about local traditions while also serving as a base for exploring nearby villages and natural landscapes. The Kohima War Cemetery is an important historical site. Visitors should respect local customs and check local access arrangements when travelling beyond the city."], "Imphal": ["Approx. 786 m", "Imphal is the capital of Manipur and an important cultural centre surrounded by hills and valleys. The city is known for its markets, historic sites and access to attractions such as Loktak Lake and the wider Manipur landscape. Visitors can experience local food, crafts and cultural traditions alongside nearby natural destinations. Travel times can be longer in the hilly region, so allowing flexibility is useful."], "Raipur": ["Approx. 298 m", "Raipur is the capital of Chhattisgarh and an important gateway to the state's cultural and natural attractions. The city offers museums, markets and modern urban facilities while providing access to destinations farther into the Bastar and central Chhattisgarh regions. Visitors can use Raipur as a practical base for longer regional trips. The climate is warm for much of the year, making cooler months more comfortable for outdoor sightseeing."], "Ranchi": ["Approx. 651 m", "Ranchi is the capital of Jharkhand and sits on a plateau known for waterfalls, forests and lakes. The city combines urban attractions with easy access to natural landscapes, making it a useful base for exploring the surrounding region. Visitors can include waterfalls, temples and scenic areas in day trips from the city. The cooler months are generally more comfortable for visiting outdoor attractions."], "Ahmedabad": ["Approx. 53 m", "Ahmedabad is a major Gujarat city known for its historic old city, stepwells, museums, food and distinctive architecture. Its heritage streets and monuments reflect centuries of trade, craftsmanship and regional history. Visitors can combine heritage walks with local cuisine, museums and nearby destinations. The cooler months are generally more comfortable for walking through the old city and visiting outdoor sites."], "Dwarka": ["Near sea level", "Dwarka is a major coastal pilgrimage city associated with Krishna traditions and is one of India's important sacred destinations. The Dwarkadhish Temple and nearby coastal and religious sites form the centre of the visitor experience. The city can be combined with other pilgrimage destinations along Gujarat's coast. Visitors should allow time for temple schedules and local religious customs when planning sightseeing."], "Somnath": ["Near sea level", "Somnath is a major pilgrimage destination on Gujarat's Arabian Sea coast and is centred on the celebrated Somnath Temple. The temple, seafront and nearby heritage sites create a combination of spiritual and coastal experiences. Visitors often include Somnath in a wider Gujarat pilgrimage and heritage circuit with Dwarka and Gir. The coastal climate can be warm, so comfortable timing for outdoor visits is useful."], "Rann of Kutch": ["Near sea level", "The Rann of Kutch is a vast seasonal salt-marsh landscape famous for its striking white salt desert and distinctive horizon. The region is also known for crafts, embroidery, village traditions and cultural festivals that showcase the diversity of Kutch. Visitors can experience the landscape around sunrise or sunset and explore nearby craft communities. Seasonal access, festival schedules and local permits or regulations should be checked before travelling."], "Lucknow": ["Approx. 123 m", "Lucknow is the capital of Uttar Pradesh and is celebrated for its Nawabi heritage, elegant architecture, traditional cuisine and chikankari embroidery. Historic buildings, gardens, markets and monuments reveal the city's distinctive cultural character. Visitors can explore the Bara Imambara, Rumi Darwaza and old-city areas while trying local specialities. The cooler months are generally comfortable for walking through heritage districts."], "Agatti": ["Near sea level", "Agatti is one of the most scenic islands of Lakshadweep and is known for clear lagoons, coral reefs, beaches and a relaxed tropical setting. The island is especially attractive for travellers interested in swimming, snorkelling, diving and other marine experiences when conditions permit. Its small size creates a quiet contrast to mainland destinations. Boat and flight schedules, permits and weather conditions are important to check before travel."], "Kavaratti": ["Near sea level", "Kavaratti is the capital island of Lakshadweep and is known for its clear lagoon, beaches, coral reefs and peaceful island environment. Visitors can enjoy water-based activities, explore the island's coastal scenery and experience the slower pace of island life. The lagoon is a major part of the destination's appeal. Travel requires attention to island permits, transport schedules and sea conditions."], "Pondicherry": ["Near sea level", "Pondicherry, officially Puducherry, is a coastal heritage destination known for French-influenced architecture, quiet streets, cafés, beaches and a distinctive blend of Indian and European cultural influences. The French Quarter, promenade, churches, temples and nearby Auroville provide a varied visitor experience. The town is well suited to relaxed walking, food, photography and short cultural breaks. The cooler dry months are generally comfortable for exploring the town on foot."], "Bhongir": ["Altitude varies by locality", "Bhongir is a notable destination in its region, known for Hill fort and regional landscapes. It offers visitors an opportunity to experience the area's landscape, culture and local character. The destination can be combined with nearby attractions for a fuller itinerary, with local food and regional experiences adding to the visit. Travellers should check current weather, opening arrangements and local access conditions before planning outdoor activities."], "Loktak Lake": ["Altitude varies by locality", "Loktak Lake is a notable destination in its region, known for Floating islands and lake landscapes. It offers visitors an opportunity to experience the area's landscape, culture and local character. The destination can be combined with nearby attractions for a fuller itinerary, with local food and regional experiences adding to the visit. Travellers should check current weather, opening arrangements and local access conditions before planning outdoor activities."], "Moirang": ["Altitude varies by locality", "Moirang is a notable destination in its region, known for Loktak surroundings and historical sites. It offers visitors an opportunity to experience the area's landscape, culture and local character. The destination can be combined with nearby attractions for a fuller itinerary, with local food and regional experiences adding to the visit. Travellers should check current weather, opening arrangements and local access conditions before planning outdoor activit const STATE="Pondicherry";
const SLUG="puducherry";
const PLACES=[{"name": "Pondicherry", "lat": 11.9416, "lon": 79.8083, "desc": "French Quarter, promenade and beaches"}, {"name": "Auroville", "lat": 12.0069, "lon": 79.81, "desc": "Experimental township and Matrimandir"}];
const GEOURL=`https://cdn.jsdelivr.net/gh/udit-001/india-maps-data@main/geojson/states/${SLUG}.geojson`;

const svg=document.getElementById("map"), layout=document.getElementById("layout"), detail=document.getElementById("detail"), tip=document.getElementById("tip");

function project(features){
  const coords=[];
  const walk=g=>Array.isArray(g[0])?g.forEach(walk):coords.push(g);
  features.forEach(f=>walk(f.geometry.coordinates));
  const xs=coords.map(p=>p[0]), ys=coords.map(p=>p[1]);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const pad=35, w=900-pad*2, h=620-pad*2;
  const sx=w/Math.max(maxX-minX,.001), sy=h/Math.max(maxY-minY,.001), s=Math.min(sx,sy);
  const ox=pad+(w-(maxX-minX)*s)/2, oy=pad+(h-(maxY-minY)*s)/2;
  return p=>[ox+(p[0]-minX)*s, 620-(oy+(p[1]-minY)*s)];
}
function pathFor(g,proj){
  const ring=r=>r.map((p,i)=>(i?"L":"M")+proj(p).map(v=>v.toFixed(2)).join(",")).join("")+"Z";
  if(g.type==="Polygon") return g.coordinates.map(ring).join("");
  return g.coordinates.map(poly=>poly.map(ring).join("")).join("");
}
function moveTip(e){
  let x=e.clientX+15,y=e.clientY+15;
  if(x>innerWidth-285)x=e.clientX-275;if(y>innerHeight-120)y=e.clientY-105;
  tip.style.left=x+"px";tip.style.top=y+"px";
}
function tooltip(el,e){
  tip.querySelector("strong").textContent=el.dataset.name;
  tip.querySelector("small").textContent=STATE;
  tip.querySelector("div").textContent=el.dataset.desc;
  tip.classList.add("show");moveTip(e);
}

async function getResearchedPlacePhoto(name,destination){
  const key="researched-photo|"+name+"|"+destination;
  if(Object.prototype.hasOwnProperty.call(WIKI_CACHE,key)) return WIKI_CACHE[key];

  const terms=[
    name+" "+destination,
    '"'+name+'" "'+destination+'"',
    name+" India"
  ];
  const all=[];
  const seen=new Set();

  try{
    for(const term of terms){
      const url="https://commons.wikimedia.org/w/api.php?action=query"+
        "&generator=search&gsrsearch="+encodeURIComponent(term)+
        "&gsrnamespace=6&gsrlimit=20&prop=imageinfo"+
        "&iiprop=url|mime|size|extmetadata&iiurlwidth=1400&format=json&origin=*";
      const r=await fetch(url);
      const j=await r.json();
      const ps=j.query&&j.query.pages?Object.values(j.query.pages):[];
      for(const p of ps){
        if(!seen.has(p.pageid)){seen.add(p.pageid);all.push(p);}
      }
    }

    const stop=/watermark|watermarked|logo|map|locator|diagram|schematic|screenshot|poster|banner|flag|icon|coat.?of.?arms|infobox|collage|montage|chart|route map|travel map|ai[-_ ]?(generated|created)|generated by ai/i;
    const nWords=name.toLowerCase().replace(/[^a-z0-9]+/g," ").split(/\s+/).filter(w=>w.length>2);
    const dWords=destination.toLowerCase().replace(/[^a-z0-9]+/g," ").split(/\s+/).filter(w=>w.length>2);

    function score(p){
      const ii=p.imageinfo&&p.imageinfo[0];
      if(!ii) return -999;
      if(!/^image\/(jpeg|jpg|png|webp)$/i.test(ii.mime||"")) return -999;
      const title=(p.title||"").replace(/^File:/i,"").toLowerCase();
      const meta=ii.extmetadata||{};
      const desc=String((meta.ImageDescription&&meta.ImageDescription.value)||"")
        .replace(/<[^>]*>/g," ").toLowerCase();
      const cats=String((meta.Categories&&meta.Categories.value)||"").toLowerCase();
      const text=title+" "+desc+" "+cats;
      if(stop.test(text)) return -500;

      let s=0;
      const nHit=nWords.filter(w=>text.includes(w)).length;
      const dHit=dWords.filter(w=>text.includes(w)).length;
      s+=nHit*6+dHit*3;
      if(title.includes(name.toLowerCase())) s+=15;
      if(title.includes(destination.toLowerCase())) s+=7;

      const w=Number(ii.width||0), h=Number(ii.height||0);
      if(w<700 || h<450) s-=4;
      if(w>=1000 && h>=600) s+=2;
      if(w/h<0.45 || w/h>3.2) s-=3;

      // Reject generic destination photos when the attraction itself is not mentioned.
      if(nWords.length && nHit===0) s-=15;
      return s;
    }

    all.sort((a,b)=>score(b)-score(a));
    const best=all.find(p=>score(p)>=10);

    const result=best ? {
      url:best.imageinfo[0].thumburl||best.imageinfo[0].url,
      key:String(best.pageid)
    } : null;

    WIKI_CACHE[key]=result;
    return result;
  }catch(e){
    WIKI_CACHE[key]=null;
    return null;
  }
}

async function populateVisitMedia(destination){
  const cards=[...document.querySelectorAll("#section-places .visit-card")];
  const used=new Set();
  await Promise.all(cards.map(async card=>{
    const name=card.dataset.visitName;
    const result=await getResearchedPlacePhoto(name,destination);
    const wrap=card.querySelector(".visit-photo-wrap");
    const img=card.querySelector(".visit-photo");
    const loading=card.querySelector(".photo-loading");
    if(!result){
      if(wrap) wrap.remove();
      return;
    }
    if(used.has(result.key)){
      if(wrap) wrap.remove();
      return;
    }
    used.add(result.key);
    if(img){
      img.src=result.url;
      img.style.display="block";
    }
    if(loading) loading.remove();
  }));
}



function placesMarkup(destination){
  const groups=PLACE_VISITS[destination]||[];
  const hubs=hubFor(destination);
  if(!groups.length){
    return '<div class="places-intro"><p>No tourist-place data is available for this destination yet.</p></div>';
  }
  let html='<div class="places-intro"><p>Tourist attractions around <b>'+destination+'</b>, grouped by category.</p></div>';
  groups.forEach((g,gi)=>{
    html+='<div class="visit-group"><h4>'+g[0]+'</h4><div class="visit-grid">';
    (g[1]||[]).forEach((name,i)=>{
      const safe=name.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      html+=`<article class="visit-card" data-visit-name="${safe}">
        <div class="visit-photo-wrap"><img class="visit-photo" alt="${safe}" loading="lazy"><div class="photo-loading">Searching for a real photograph…</div></div>
        <div class="visit-body">
          <h5>${safe}</h5>
          <p class="visit-description">${fallbackPlaceDescription(name,g[0],destination)}</p>
          <div class="visit-meta">
            <span><b>Airport:</b> ${hubs[0]}</span>
            <span><b>Railway:</b> ${hubs[1]}</span>
            <span><b>Bus:</b> ${hubs[2]}</span>
          </div>
          <div class="visit-links">
            <a href="${gmSearch(name)}" target="_blank" rel="noopener">Locate place on Google Maps ↗</a>
            <a href="${gmRoute(name,hubs[0])}" target="_blank" rel="noopener">Airport route ↗</a>
            <a href="${gmRoute(name,hubs[1])}" target="_blank" rel="noopener">Rail route ↗</a>
            <a href="${gmRoute(name,hubs[2])}" target="_blank" rel="noopener">Bus route ↗</a>
          </div>
        </div>
      </article>`;
    });
    html+='</div></div>';
  });
  return html;
}

function hubFor(destination){
  const d=String(destination||"").toLowerCase();
  const hubs={
    "leh":["Kushok Bakula Rimpochee Airport (Leh)","Leh Railway Station (nearest major rail access: Jammu Tawi)","Leh Bus Stand"],
    "panaji":["Goa International Airport (Dabolim)","Madgaon Junction Railway Station","Panaji Kadamba Bus Terminal"],
    "calangute":["Goa International Airport (Dabolim)","Thivim Railway Station","Mapusa Bus Stand"],
    "palolem":["Goa International Airport (Dabolim)","Canacona Railway Station","Canacona Bus Stand"]
  };
  if(hubs[d]) return hubs[d];
  return [
    "Nearest airport serving "+destination,
    "Nearest railway station serving "+destination,
    "Main bus terminal serving "+destination
  ];
}

async function init(){

  try{
    const geo=await fetch(GEOURL).then(r=>{if(!r.ok)throw new Error("Map data unavailable");return r.json()});
    const features=geo.features||[];
    const proj=project(features);
    svg.innerHTML="";
    features.forEach(f=>{const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",pathFor(f.geometry,proj));p.setAttribute("class","state");svg.appendChild(p)});
    PLACES.forEach(d=>{
      const [x,y]=proj([d.lon,d.lat]);
      const g=document.createElementNS("http://www.w3.org/2000/svg","g");
      g.setAttribute("class","pin");g.setAttribute("tabindex","0");g.setAttribute("role","button");
      g.dataset.name=d.name;g.dataset.desc=d.desc;g.dataset.lat=d.lat;g.dataset.lon=d.lon;
      g.setAttribute("transform",`translate(${x} ${y})`);
      g.innerHTML='<circle class="halo" r="11"></circle><circle class="dot" r="5.5"></circle>';
      g.addEventListener("mouseenter",e=>tooltip(g,e));g.addEventListener("mousemove",moveTip);
      g.addEventListener("mouseleave",()=>tip.classList.remove("show"));
      g.addEventListener("focus",e=>tooltip(g,e));g.addEventListener("blur",()=>tip.classList.remove("show"));
      g.addEventListener("click",()=>selectPlace(g));
      g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectPlace(g)}});
      svg.appendChild(g);
    });
  }catch(err){svg.innerHTML='<text x="450" y="300" text-anchor="middle" fill="#ffb7a8" font-size="15">Could not load the state map.</text>';}
}

(function(){
  function esc(s){
    return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }
  function maps(name,city){
    return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(name+", "+city+", India");
  }
  function route(city,name){
    return "https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(city+" city centre, India")+"&destination="+encodeURIComponent(name+", "+city+", India");
  }
  async function photo(name,img){
    const removePhoto=()=>{
      const card=img.closest(".transport-card");
      const box=img.closest(".transport-photo-box");
      if(card) card.classList.add("no-photo");
      if(box) box.remove();
    };
    try{
      const u="https://commons.wikimedia.org/w/api.php?action=query&generator=search"+
        "&gsrsearch="+encodeURIComponent('"'+name+'"')+
        "&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|mime"+
        "&iiurlwidth=800&format=json&origin=*";
      const r=await fetch(u);
      if(!r.ok) throw 0;
      const j=await r.json();
      const arr=Object.values(j.query&&j.query.pages||{});
      const bad=/logo|map|diagram|icon|symbol|flag|poster|screenshot|drawing|plan|seal/i;
      const hit=arr.find(x=>{
        const z=x.imageinfo&&x.imageinfo[0];
        return z && /^image\/(jpeg|jpg|png|webp)$/i.test(z.mime||"") && !bad.test(x.title||"");
      });
      const src=hit && hit.imageinfo && hit.imageinfo[0] && (hit.imageinfo[0].thumburl||hit.imageinfo[0].url);
      if(src){
        img.src=src;
        img.classList.add("loaded");
      }else{
        removePhoto();
      }
    }catch(e){removePhoto();}
  }
  function card(city,name,desc,kind){
    const id="tr_"+kind+"_"+Math.random().toString(36).slice(2);
    const s=esc(name);
    const html=`<article class="transport-card">
      <div class="transport-photo-box">
        <img id="${id}" class="transport-photo" alt="${s}" loading="lazy"
             onerror="this.closest('.transport-card')?.classList.add('no-photo');this.closest('.transport-photo-box')?.remove()">
      </div>
      <div class="transport-info">
        <h5>${s}</h5>
        <p>${esc(desc)}</p>
      </div>
      <div class="transport-links">
        <a href="${maps(name,city)}" target="_blank" rel="noopener">Locate on Google Maps ↗</a>
        <a href="${route(city,name)}" target="_blank" rel="noopener">Route from city centre ↗</a>
      </div>
    </article>`;
    setTimeout(()=>loadPhotoLater(id,name),0);
    return html;
  }
  function loadPhotoLater(id,name){
    const img=document.getElementById(id);
    if(img) photo(name,img);
  }
  window.loadTransportSection=function(city){
    const root=document.getElementById("transportContainer");
    if(!root) return;
    const d=window.TRANSPORT_ONE_EACH[city];
    if(!d){
      root.innerHTML="<div class='transport-group'><h4>Modes of Transport</h4><p>Transport information is not available for this destination.</p></div>";
      return;
    }
    root.innerHTML=
      `<div class="transport-group airport"><h4>Nearby Airport</h4>`+
      card(city,d.airport,"Airport serving this destination.","airport")+
      `</div>`+
      `<div class="transport-group rail"><h4>Nearest Railway Station</h4>`+
      card(city,d.rail,"Railway station serving this destination.","rail")+
      `</div>`+
      `<div class="transport-group bus"><h4>Nearest Bus Stand</h4>`+
      card(city,d.bus,"Bus stand / terminal serving this destination.","bus")+
      `</div>`;
  };
})();
</script>
<script id="ways-planner-js">
(function(){
  function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
  function q(s){return encodeURIComponent(String(s||"").trim());}
  function mapsRoute(a,b){return "https://www.google.com/maps/dir/?api=1&origin="+q(a+", India")+"&destination="+q(b+", India");}
  function flightLink(a,b,date){
    let u="https://www.google.com/travel/flights?hl=en";
    u+="&q=Flights%20from%20"+q(a)+"%20to%20"+q(b);
    if(date)u+="%20on%20"+q(date);
    return u;
  }
  function trainSearch(a,b){
    return "https://www.google.com/search?q="+q(a+" to "+b+" trains timetable direct");
  }
  function railInfo(a,b){
    return "https://www.google.com/search?q="+q(a+" "+b+" trains eRail timetable");
  }
  function busSearch(a,b){return "https://www.google.com/search?q="+q(a+" to "+b+" bus timetable");}
  function dayRow(days){
    const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    return '<div class="day-row">'+names.map(x=>`<span class="day ${days.includes(x)?'on':''}">${x}</span>`).join("")+'</div>';
  }

  function verifiedExample(a,b){
    const A=a.toLowerCase().replace(/\\s+/g," ").trim();
    const B=b.toLowerCase().replace(/\\s+/g," ").trim();
    return (A==="bhubaneswar"||A==="bhubaneswar railway station"||A==="bbs") &&
           (B==="jammu"||B==="jammu tawi"||B==="jammu tawi railway station"||B==="jat");
  }

  function renderWays(detail){
    const root=detail.querySelector("#waysPlanner");
    if(!root)return;
    const dest=detail.dataset.destination||"";
    root.innerHTML=`
      <p class="ways-lead">Enter your starting point and travel date. The destination is pre-filled with the place you selected, but you can change it. Train results separate direct and connection searches; flight results open Google Flights with your route already prepared.</p>
      <form class="ways-form" id="waysForm">
        <div><label for="waysFrom">Starting point</label><input id="waysFrom" class="ways-field" required placeholder="City / station / airport"></div>
        <div><label for="waysTo">Ending point</label><input id="waysTo" class="ways-field" required value="${esc(dest)}"></div>
        <div><label for="waysDate">Travel date (optional)</label><input id="waysDate" class="ways-field" type="date"></div>
        <button class="ways-submit" type="submit">Find travel options</button>
      </form>
      <div id="waysResults"></div>`;
    const form=root.querySelector("#waysForm");
    form.addEventListener("submit",e=>{
      e.preventDefault();
      const a=root.querySelector("#waysFrom").value.trim();
      const b=root.querySelector("#waysTo").value.trim();
      const date=root.querySelector("#waysDate").value;
      if(!a||!b)return;
      showResults(root,a,b,date);
    });
  }


  const TRAIN_ROUTE_DATA = {"bbs_jat": {"from": "Bhubaneswar", "to": "Jammu Tawi", "direct": [], "legs": [{"route": "Bhubaneswar → New Delhi → Jammu Tawi", "via": "New Delhi", "first": [["20817", "Tejas Raj Exp", "BBS", "07:15", "NDLS", "09:55", "Saturday"], ["20807", "Hirakud Express", "BBS", "07:15", "NDLS", "14:30", "Tuesday, Friday, Saturday"], ["12281", "BBS Duronto Exp", "BBS", "07:35", "NDLS", "06:40", "Wednesday"], ["12819", "Odisha Sampark Kranti Exp", "BBS", "16:17", "ANVT", "19:35", "Sunday, Wednesday"], ["12801", "Purushottam Express", "BBS", "23:00", "ANVT", "03:50", "Daily"]], "second": [["12426", "Jammu Rajdhani", "NDLS", "05:55", "JAT", "21:25", "Daily"], ["16031", "Andaman Express", "NDLS", "13:35", "JAT", "08:20", "Daily"], ["16317", "Himsagar Express", "NDLS", "13:35", "JAT", "08:20", "Weekly / verify date"], ["16787", "Tirunelveli–SMVD Katra Exp", "NDLS", "13:35", "JAT", "08:20", "Weekly / verify date"]]}, {"route": "Bhubaneswar → Howrah → Jammu Tawi", "via": "Howrah", "first": [["12842", "Coromandel Express", "BBS", "02:00", "HWH", "11:00", "Daily"], ["22818", "Mysuru–Howrah Weekly SF Exp", "BBS", "03:10", "HWH", "11:10", "Weekly"], ["18040", "Puri–Shalimar Express", "BBS", "01:15", "SHM", "08:50", "Daily / verify date"]], "second": [["12301", "Howrah–New Delhi Rajdhani", "HWH", "16:55", "NDLS", "10:00", "Daily"], ["12313", "Sealdah–New Delhi Rajdhani", "HWH/Sealdah", "16:50", "NDLS", "10:05", "Daily"], ["13151", "Kolkata–Jammu Tawi Express", "HWH", "11:45", "JAT", "14:10", "Weekly / verify date"]]}]}};
  function trainRow(x){
    return `<div class="train-row">
      <div><strong>${esc(x[0])}</strong> — ${esc(x[1])}</div>
      <div>${esc(x[2])} ${esc(x[3])} → ${esc(x[4])} ${esc(x[5])}</div>
      <div class="train-days">Runs: ${esc(x[6])}</div>
    </div>`;
  }
  function trainCard(x,label){
    return `<article class="travel-card"><h5>${label}: ${esc(x[1])}</h5>${trainRow(x)}</article>`;
  }

  function showResults(root,a,b,date){
    const results=root.querySelector("#waysResults");
    const key=(a.toLowerCase().trim().includes("bhubaneswar")||a.toLowerCase().trim()==="bbs") &&
              (b.toLowerCase().trim().includes("jammu")||b.toLowerCase().trim()==="jat") ? "bbs_jat" : null;

    let trainHtml="";
    if(key){
      const d=TRAIN_ROUTE_DATA[key];
      trainHtml += `<div class="ways-note"><strong>Direct trains:</strong> ${d.direct.length ? d.direct.length+" direct service(s) found." : "No direct train is listed for this route."} India Rail Info currently lists 0 direct trains for BBS → JAT. The alternatives below use actual train legs through an intermediate station.</div>`;
      if(d.direct.length){
        d.direct.forEach(x=>{
          trainHtml+=trainCard(x,"Direct");
        });
      }
      d.legs.forEach((leg,idx)=>{
        trainHtml+=`<article class="travel-card route-option">
          <h5>Alternative ${idx+1}: via ${esc(leg.via)}</h5>
          <div class="route-line">${esc(leg.route)}</div>
          <p class="leg-heading">Leg 1 — ${esc(leg.first[0][2])} → ${esc(leg.first[0][4])}</p>
          ${leg.first.map(x=>trainRow(x)).join("")}
          <p class="leg-heading">Leg 2 — ${esc(leg.second[0][2])} → ${esc(leg.second[0][4])}</p>
          ${leg.second.map(x=>trainRow(x)).join("")}
          <div class="ways-actions"><a target="_blank" rel="noopener" href="https://www.irctc.co.in/">Open IRCTC ↗</a></div><div class="ways-note">Check the selected travel date before booking. A connection is only catchable if the two selected trains operate on that date and the interchange time is sufficient.</div>
        </article>`;
      });
    }else{
      trainHtml=`<div class="ways-empty"><strong>Train list for ${esc(a)} → ${esc(b)}</strong><p>A verified train list is not embedded for this route yet. No train names or running days are guessed. The planner will only display a train after its timetable is verified.</p></div>`;
    }

    const flight=`
      <article class="travel-card">
        <h5>Flights</h5>
        <div class="route-line">${esc(a)} → ${esc(b)}</div>
        <p>Choose your date and compare direct and connecting flights on Google Flights.</p>
        <div class="ways-actions"><a target="_blank" rel="noopener" href="${flightLink(a,b,date)}">Open Google Flights ↗</a></div>
      </article>`;
    const road=`
      <article class="travel-card">
        <h5>Bus / Cab / Road</h5>
        <div class="route-line">${esc(a)} → ${esc(b)}</div>
        <p>Compare road options and the route between your starting point and destination.</p>
        <div class="ways-actions"><a target="_blank" rel="noopener" href="${busSearch(a,b)}">Search bus options ↗</a><a target="_blank" rel="noopener" href="${mapsRoute(a,b)}">Open road route ↗</a></div>
      </article>`;

    results.innerHTML=`
      <div class="ways-tabs">
        <button class="ways-tab active" data-way="train">Train</button>
        <button class="ways-tab" data-way="flight">Flight</button>
        <button class="ways-tab" data-way="road">Bus / Cab</button>
      </div>
      <div class="ways-panel active" data-panel="train">${trainHtml}</div>
      <div class="ways-panel" data-panel="flight">${flight}</div>
      <div class="ways-panel" data-panel="road">${road}</div>
      <div class="ways-note">Train numbers, routes and running days shown here are timetable data, not guesses. Always confirm availability and the exact travel date before booking.</div>`;

    results.querySelectorAll(".ways-tab").forEach(btn=>btn.addEventListener("click",()=>{
      results.querySelectorAll(".ways-tab").forEach(x=>x.classList.remove("active"));
      results.querySelectorAll(".ways-panel").forEach(x=>x.classList.remove("active"));
      btn.classList.add("active");
      results.querySelector(`[data-panel="${btn.dataset.way}"]`).classList.add("active");
    }));
  }

  window.initWaysPlanner=function(detail,destination){
    detail.dataset.destination=destination||"";
    renderWays(detail);
  };
})();
</script>
